[pytest]
testpaths = tests
pythonpath = .
# No .pytest_cache folder in the repo
addopts = -p no:cacheprovider
# Deprecation notices from third-party test tools, not from DermaCare code
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock
    ignore:Using `httpx` with `starlette.testclient` is deprecated
